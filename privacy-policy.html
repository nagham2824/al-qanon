<script id="aq-legal-language-picker">(()=>{const select=document.getElementById("language")||document.getElementById("lang");if(!select)return;const control=select.closest(".language-control,.terms-language-control");if(!control)return;const names={ar:"العربية",nl:"Nederlands",en:"English",tr:"Türkçe"},flags={ar:"🇱🇧",nl:"🇳🇱",en:"🇬🇧",tr:"🇹🇷"};const button=document.createElement("button"),menu=document.createElement("div");button.type="button";button.className="aq-legal-language-trigger";button.setAttribute("aria-haspopup","listbox");button.setAttribute("aria-expanded","false");button.setAttribute("aria-label",select.getAttribute("aria-label")||"Language");const value=document.createElement("span"),chevron=document.createElement("span");chevron.className="aq-legal-language-chevron";chevron.textContent="⌄";chevron.setAttribute("aria-hidden","true");button.append(value,chevron);menu.className="aq-legal-language-menu";menu.hidden=true;menu.id="aqLegalLanguageMenu";menu.setAttribute("role","listbox");button.setAttribute("aria-controls",menu.id);for(const option of select.options){const item=document.createElement("button");item.type="button";item.className="aq-legal-language-option";item.setAttribute("role","option");item.dataset.language=option.value;const flag=document.createElement("span"),label=document.createElement("span");flag.className="aq-legal-option-flag";flag.setAttribute("aria-hidden","true");flag.textContent=flags[option.value]||"";label.className="aq-legal-option-label";label.textContent=names[option.value]||option.textContent.trim();item.append(flag,label);item.addEventListener("click",()=>{select.value=option.value;select.dispatchEvent(new Event("change",{bubbles:true}));close();button.focus()});menu.append(item)}function sync(){const lang=select.value in names?select.value:"ar";value.textContent=(flags[lang]||"")+"  "+names[lang];button.setAttribute("aria-label",lang==="ar"?"اللغة":lang==="nl"?"Taal":lang==="tr"?"Dil":"Language");menu.querySelectorAll("[role=option]").forEach(item=>item.setAttribute("aria-selected",String(item.dataset.language===lang)))}function close(){menu.hidden=true;button.setAttribute("aria-expanded","false")}button.addEventListener("click",()=>{menu.hidden=!menu.hidden;button.setAttribute("aria-expanded",String(!menu.hidden))});document.addEventListener("click",event=>{if(!control.contains(event.target))close()});document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!menu.hidden){close();button.focus()}});select.addEventListener("change",sync);select.classList.add("aq-legal-native-select");select.tabIndex=-1;select.setAttribute("aria-hidden","true");select.insertAdjacentElement("beforebegin",button);control.append(menu);sync()})();</script></body>
