<style>
:root{--ink:#102a43;--gold:#b28136;--paper:#fffdf8;--line:#e4d9c5}
*{box-sizing:border-box}
body{margin:0;background:#f5f1e9;color:var(--ink);font:16px/1.85 Cairo,Arial,sans-serif}
header{background:#0b2033;color:#fffaf0;border-bottom:2px solid #d1a153;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px max(5%,calc((100% - 1080px)/2))}
.brand-wrap{display:inline-flex;align-items:center}
.brand-logo{display:block;width:clamp(126px,24vw,178px);height:60px;object-fit:contain}
.language-control{display:flex;align-items:center;gap:.55rem;font-size:.86rem}
.lang{background:#132e47;color:#fffaf0;border:1px solid #d1a153a0;border-radius:8px;padding:8px;font:inherit}
main{width:min(900px,calc(100% - 32px));margin:clamp(18px,5vw,46px) auto}
.panel{--pad:clamp(17px,5vw,48px);background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 36px #102a4312;overflow:hidden;padding:0 var(--pad) var(--pad)}
h1{margin:0 calc(-1 * var(--pad)) 22px;padding:clamp(22px,5vw,42px) var(--pad);background:radial-gradient(ellipse at 15% 30%,#1d4260,#0b2033 78%);border-bottom:1px solid #d1a153;color:#f7deb0;font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.3}
.notice{display:table;background:#f5ecdb;color:#62491f;border:1px solid #eadab9;border-radius:8px;padding:5px 12px;font-size:.83rem;font-weight:700;margin:0 0 22px}
h2{margin:24px 0 6px;padding-block-start:15px;border-top:1px solid var(--line);color:#102a43;font-size:clamp(1.05rem,2.4vw,1.22rem);line-height:1.5}
p{margin:0;overflow-wrap:anywhere;color:#34495a}
a{color:#755017;text-underline-offset:3px}
footer{padding:17px;text-align:center;background:#0b2033;color:#e5ebee;border-top:1px solid #b78d47;font-size:.85rem}
footer a{color:#f7deb0}
:focus-visible{outline:2px solid #b28136;outline-offset:3px}
@media(max-width:440px){header{padding-inline:14px}.language-control label{font-size:.75rem}main{width:calc(100% - 22px)}}

footer{position:relative;text-align:start;padding:0;background:radial-gradient(ellipse at 85% 0,#173651,#0a1d30 68%);border-top:1px solid #b78d47}
footer::before{content:"";position:absolute;inset-block-start:-4px;inset-inline-start:calc(50% - 4px);width:7px;height:7px;background:#deb66a;transform:rotate(45deg);box-shadow:0 0 0 5px #0d2237}
.policy-footer-inner{width:min(900px,calc(100% - 36px));margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px}
.policy-footer-brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;color:#e5ebee}
.policy-footer-brand strong{color:#e9c786;letter-spacing:.06em}
.policy-footer-home{display:inline-flex;align-items:center;gap:9px;border:1px solid #d6ad6373;border-radius:7px;padding:6px 12px;text-decoration:none}
.policy-footer-home:hover{text-decoration:underline}
.policy-footer-home svg{width:16px;height:16px;flex:none;color:#e2b86d}
html[dir="rtl"] .policy-footer-home svg{transform:scaleX(-1)}
@media(max-width:440px){.policy-footer-inner{align-items:flex-start;flex-direction:column;gap:10px}}
</style>
