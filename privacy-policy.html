const content={
ar:{title:"سياسة الخصوصية",updated:"آخر تحديث: 28 أكتوبر 2026",intro:"توضح هذه السياسة البيانات التي قد تُعالج عند استخدام منصة القانون AQ، وأسباب ذلك، وكيفية التواصل بشأن الخصوصية. المنصة تقدّم معلومات قانونية عامة وليست مكتب محاماة.",controller:"1. الجهة المسؤولة والتواصل",controllerText:"المسؤولة عن المنصة ومعالجة البيانات هي نور أدهم دليقان (Nour Adham Dlikan)، بصفتها فردًا. لطلبات الخصوصية أو الاستفسارات: nour.dlikan@gmail.com.",data:"2. البيانات التي قد نعالجها",dataText:"عند إرسال مقال عبر نموذج الزوار، نعالج عنوان المقال ونصه والقسم واللغة والاسم الاختياري الذي تدخله وحالة المراجعة. قد تضيف الإدارة رابط المصدر عند تحرير المقال. عند إرسال طلب تطوع عبر النموذج، ينشئ الموقع رسالة في برنامج البريد الإلكتروني على جهازك؛ لا يرسل الموقع الطلب بنفسه ولا يحفظ بيانات النموذج في قاعدة بياناته. إذا أرسلت الرسالة، فسنتلقى البيانات التي اخترت تضمينها، مثل الاسم والبريد الإلكتروني ومجال المساهمة واللغة والرسالة وأي مرفقات.",purposes:"3. الأغراض والأساس القانوني",purposesText:"نستخدم البيانات اللازمة لمراجعة المساهمات ونشر المقالات وإدارة طلبات التطوع والرد على الاستفسارات وحماية المنصة. بحسب الحالة، قد يكون الأساس القانوني تنفيذ خطوات طلبتها، أو المصلحة المشروعة في إدارة منصة آمنة ومفيدة، أو موافقتك عندما تكون مطلوبة. سنطلب توضيحًا أو موافقة إضافية إذا تطلب القانون ذلك.",articles:"4. المقالات والمراجعة",articlesText:"المقالات التي يرسلها الزوار تكون قيد المراجعة ولا تُنشر تلقائيًا. قد يطّلع المسؤول المخوّل على المقالات المقدّمة لإدارتها. نحذف المقالات المعلّقة أو المرفوضة يدويًا عادةً خلال 7–15 يومًا؛ لا يوجد حذف آلي حاليًا. تبقى المقالات المنشورة ما دامت مفيدة ودقيقة، وتُراجع أو تُحدّث أو تُزال عند الحاجة. لا ترسل معلومات شخصية حساسة أو بيانات تخص أشخاصًا آخرين دون أساس مناسب.",volunteer:"5. طلبات التطوع",volunteerText:"نموذج التطوع يجهّز رسالة بريد إلكتروني على جهازك ولا يرسلها تلقائيًا. إذا اخترت إرسالها، تُستخدم بياناتها للتواصل بشأن الطلب. نهدف إلى حذف الطلبات غير المقبولة خلال أربعة أسابيع من إغلاقها، ما لم توجد حاجة قانونية أو مشروعة للاحتفاظ ببعض البيانات. نحتفظ ببيانات المتطوعين النشطين فقط بالقدر اللازم للتنسيق، ونحذف بيانات التواصل غير الضرورية بعد انتهاء التعاون.",recipients:"6. الخدمات الخارجية ومشاركة البيانات",recipientsText:"تستخدم المنصة خدمات خارجية لتشغيل وظائفها، منها Supabase لاستضافة قاعدة البيانات والمصادقة، وjsDelivr لتحميل مكتبة برمجية، وGoogle Fonts للخطوط، وUnsplash لعرض الصور. عند تحميل موارد من هذه الخدمات، قد تتلقى الجهة المزودة بيانات تقنية مثل عنوان IP ومعلومات المتصفح والطلب. تُعالج البيانات داخل الخدمات وفق إعداداتها وشروطها وسياساتها. لا نبيع البيانات ولا نستخدم حاليًا أدوات تحليل إعلاني مقصودة مثل Google Analytics. لا نشارك البيانات الشخصية مع جهات أخرى إلا عند الحاجة لتشغيل المنصة أو وجود أساس قانوني.",cookies:"7. ملفات تعريف الارتباط والتخزين المحلي",cookiesText:"قد تستخدم مكتبة المصادقة لدى Supabase تخزين المتصفح للحفاظ على جلسة دخول الإدارة. لم نضف عمدًا أدوات تتبع إعلاني أو تحليلات. قد تتغير التفاصيل تبعًا لإعدادات الخدمة والمتصفح؛ يمكن إدارة بيانات المتصفح أو حذفها من إعداداته، لكن ذلك قد يؤدي إلى تسجيل الخروج.",retention:"8. مدة الاحتفاظ",retentionText:"نحتفظ بالبيانات فقط للمدة اللازمة للأغراض الموضحة أعلاه، مع مراعاة الالتزامات القانونية وحل النزاعات وحماية المنصة. المدد المذكورة للمقالات وطلبات التطوع إرشادية للعمل الحالي وقد تختلف إذا وُجد سبب مشروع أو قانوني للاحتفاظ.",rights:"9. حقوقك",rightsText:"بحسب القانون المنطبق، قد يحق لك طلب الوصول إلى بياناتك أو تصحيحها أو حذفها أو تقييد معالجتها أو الاعتراض عليها، وسحب الموافقة عندما تكون المعالجة قائمة عليها، وطلب نقل البيانات حيث ينطبق ذلك. أرسل طلبك إلى البريد المذكور أعلاه. قد نطلب معلومات معقولة للتحقق من هويتك، وقد لا يمكن تنفيذ الحذف إذا أوجب القانون الاحتفاظ ببعض البيانات.",complaint:"10. الشكاوى",complaintText:"إذا كنت في هولندا، يمكنك تقديم شكوى إلى هيئة حماية البيانات الهولندية Autoriteit Persoonsgegevens عبر",security:"11. أمن البيانات",securityText:"نستخدم ضوابط تقنية وتنظيمية مناسبة بحسب طبيعة المنصة، لكن لا يمكن ضمان أمن مطلق لأي خدمة عبر الإنترنت. لا ترسل كلمات مرور أو معلومات حساسة ضمن المقالات أو رسائل التطوع.",changes:"12. تحديث السياسة",changesText:"قد نحدّث هذه السياسة عند تغير المنصة أو المتطلبات القانونية. سننشر النسخة المحدّثة في هذه الصفحة مع تعديل تاريخ التحديث.",back:"العودة إلى المنصة",language:"اللغة"},
nl:{title:"Privacyverklaring",updated:"Laatst bijgewerkt: 28 oktober 2026",intro:"Deze verklaring beschrijft welke gegevens bij gebruik van AQ Juridisch kunnen worden verwerkt, waarom dat gebeurt en hoe u contact kunt opnemen over privacy. Het platform biedt algemene juridische informatie en is geen advocatenkantoor.",controller:"1. Verantwoordelijke en contact",controllerText:"De verantwoordelijke voor het platform en de gegevensverwerking is Nour Adham Dlikan, handelend als particulier. Voor privacyverzoeken of vragen: nour.dlikan@gmail.com.",data:"2. Welke gegevens kunnen worden verwerkt",dataText:"Bij een artikelinzending via het bezoekersformulier verwerken we de titel, tekst, categorie, taal, de optioneel ingevulde naam en de beoordelingsstatus. Een beheerder kan later een bronlink toevoegen. Het vrijwilligersformulier maakt een e-mail aan in uw eigen e-mailprogramma; de website verstuurt die niet zelf en bewaart de formuliergegevens niet in haar database. Als u de e-mail verzendt, ontvangen wij de gegevens die u daarin opneemt, zoals naam, e-mailadres, bijdragegebied, taal, bericht en eventuele bijlagen.",purposes:"3. Doeleinden en rechtsgrond",purposesText:"We verwerken gegevens die nodig zijn om bijdragen te beoordelen en te publiceren, vrijwilligersaanvragen te beheren, vragen te beantwoorden en het platform te beveiligen. Afhankelijk van de situatie is de rechtsgrond het uitvoeren van stappen op uw verzoek, ons gerechtvaardigd belang bij een veilig en nuttig platform, of uw toestemming wanneer die vereist is. Waar de wet dat verlangt, vragen we om aanvullende informatie of toestemming.",articles:"4. Artikelen en beoordeling",articlesText:"Door bezoekers ingezonden artikelen staan ter beoordeling en worden niet automatisch gepubliceerd. Een bevoegde beheerder kan inzendingen bekijken om ze te beheren. Concepten en afgewezen artikelen worden handmatig doorgaans binnen 7–15 dagen verwijderd; automatische verwijdering is momenteel niet ingericht. Gepubliceerde artikelen blijven beschikbaar zolang ze nuttig en actueel zijn en worden zo nodig beoordeeld, bijgewerkt of verwijderd. Stuur geen gevoelige persoonsgegevens of gegevens van anderen zonder passende grondslag.",volunteer:"5. Vrijwilligersaanvragen",volunteerText:"Het vrijwilligersformulier stelt een e-mail op uw apparaat op en verzendt deze niet automatisch. Als u de e-mail verstuurt, gebruiken we de inhoud om contact op te nemen over uw aanvraag. We streven ernaar afgewezen aanvragen binnen vier weken na afsluiting te verwijderen, tenzij een wettelijke of gerechtvaardigde reden bewaring vereist. Van actieve vrijwilligers bewaren we alleen gegevens die nodig zijn voor de samenwerking; onnodige contactgegevens worden na afloop verwijderd.",recipients:"6. Externe diensten en gegevensdeling",recipientsText:"Het platform gebruikt externe diensten, waaronder Supabase voor database en authenticatie, jsDelivr voor het laden van een softwarebibliotheek, Google Fonts voor lettertypen en Unsplash voor afbeeldingen. Bij het laden van bronnen kunnen deze aanbieders technische gegevens ontvangen, zoals IP-adres, browserinformatie en aanvraaggegevens. Verwerking door deze aanbieders valt mede onder hun eigen instellingen, voorwaarden en privacyverklaringen. We verkopen geen gegevens en hebben momenteel geen opzettelijke advertentie- of analysetrackers zoals Google Analytics toegevoegd. We delen persoonsgegevens niet met anderen, behalve waar dat nodig is voor de werking van het platform of een rechtsgrond bestaat.",cookies:"7. Cookies en lokale opslag",cookiesText:"De authenticatiebibliotheek van Supabase kan browseropslag gebruiken om de beheerderssessie te behouden. We hebben bewust geen advertentietracking of analysetools toegevoegd. Details kunnen afhangen van service- en browserinstellingen. U kunt browsergegevens via uw browser beheren of verwijderen; daardoor kunt u wel worden uitgelogd.",retention:"8. Bewaartermijnen",retentionText:"We bewaren gegevens niet langer dan nodig is voor de genoemde doeleinden, rekening houdend met wettelijke verplichtingen, geschillen en beveiliging. Genoemde termijnen voor artikelen en vrijwilligersaanvragen beschrijven de huidige werkwijze en kunnen afwijken wanneer bewaring om een wettelijke of gerechtvaardigde reden nodig is.",rights:"9. Uw rechten",rightsText:"Afhankelijk van het toepasselijke recht kunt u recht hebben op inzage, rectificatie, verwijdering, beperking, bezwaar, intrekking van toestemming wanneer daarop wordt gebaseerd, en gegevensoverdraagbaarheid waar van toepassing. Stuur uw verzoek naar het hierboven vermelde e-mailadres. We kunnen redelijke informatie vragen om uw identiteit te verifiëren. Verwijdering is niet altijd mogelijk als gegevens wettelijk moeten worden bewaard.",complaint:"10. Klachten",complaintText:"Als u in Nederland bent, kunt u een klacht indienen bij de Autoriteit Persoonsgegevens via",security:"11. Beveiliging",securityText:"We nemen passende technische en organisatorische maatregelen, rekening houdend met de aard van het platform. Absolute beveiliging van een onlinedienst kan niet worden gegarandeerd. Stuur geen wachtwoorden of gevoelige informatie via artikelen of vrijwilligersberichten.",changes:"12. Wijzigingen",changesText:"We kunnen deze verklaring aanpassen wanneer het platform of de wettelijke vereisten veranderen. De bijgewerkte versie wordt op deze pagina gepubliceerd met een nieuwe datum.",back:"Terug naar het platform",language:"Taal"},
en:{title:"Privacy Policy",updated:"Last updated: 28 October 2026",intro:"This policy explains what information may be processed when using AQ Law, why it is processed, and how to contact us about privacy. The platform provides general legal information and is not a law firm.",controller:"1. Controller and contact",controllerText:"The person responsible for the platform and its data processing is Nour Adham Dlikan, acting as an individual. For privacy requests or questions: nour.dlikan@gmail.com.",data:"2. Information we may process",dataText:"When an article is submitted through the visitor form, we process its title, text, category, language, any optional name entered, and review status. An administrator may add a source link later when editing the article. The volunteer form prepares an email in your own email application; the website does not send it itself and does not save the form data in its database. If you send the email, we receive the information you choose to include, such as your name, email address, contribution area, language, message and any attachments.",purposes:"3. Purposes and legal basis",purposesText:"We process information needed to review and publish contributions, manage volunteer applications, answer enquiries and protect the platform. Depending on the circumstances, the legal basis may be taking steps at your request, our legitimate interest in operating a useful and secure platform, or your consent where required. We will seek further information or consent where the law requires it.",articles:"4. Articles and review",articlesText:"Visitor-submitted articles are pending review and are not published automatically. An authorised administrator may access submissions to manage them. Pending and rejected articles are usually deleted manually within 7–15 days; automatic deletion is not currently configured. Published articles remain available while useful and accurate, and are reviewed, updated or removed when needed. Do not submit sensitive personal information or information about other people without an appropriate basis.",volunteer:"5. Volunteer applications",volunteerText:"The volunteer form prepares an email on your device and does not send it automatically. If you send it, we use its contents to contact you about the application. We aim to delete unsuccessful applications within four weeks after closure unless a legal or legitimate reason requires some information to be retained. For active volunteers, we retain only information needed for coordination; unnecessary contact details are deleted after the collaboration ends.",recipients:"6. Third-party services and sharing",recipientsText:"The platform uses external services, including Supabase for database hosting and authentication, jsDelivr to load a software library, Google Fonts for fonts, and Unsplash for images. When resources are requested, these providers may receive technical data such as IP address, browser information and request details. Their processing is also governed by their own settings, terms and privacy notices. We do not sell personal data and have not intentionally added advertising or analytics trackers such as Google Analytics. We do not share personal data with others except where needed to operate the platform or where a legal basis applies.",cookies:"7. Cookies and local storage",cookiesText:"Supabase's authentication library may use browser storage to maintain the administrator login session. We have not intentionally added advertising tracking or analytics tools. Details may depend on service and browser settings. You can manage or clear browser data in your browser settings, although this may sign you out.",retention:"8. Retention",retentionText:"We keep information only as long as needed for the purposes described above, taking account of legal obligations, disputes and platform security. The timeframes stated for articles and volunteer applications describe the current workflow and may vary where retention is legally or legitimately necessary.",rights:"9. Your rights",rightsText:"Depending on applicable law, you may have rights to access, correct, erase or restrict processing of your data, object to processing, withdraw consent where processing relies on it, and request portability where applicable. Send requests to the email address above. We may ask for reasonable information to verify your identity. Erasure may not be possible where the law requires certain data to be retained.",complaint:"10. Complaints",complaintText:"If you are in the Netherlands, you may lodge a complaint with the Dutch Data Protection Authority (Autoriteit Persoonsgegevens) at",security:"11. Security",securityText:"We use appropriate technical and organisational measures for the nature of the platform, but no online service can guarantee absolute security. Do not include passwords or sensitive information in article submissions or volunteer messages.",changes:"12. Changes to this policy",changesText:"We may update this policy as the platform or legal requirements change. The revised version will be published on this page with an updated date.",back:"Back to the platform",language:"Language"}
};
const order=["intro","controller","data","purposes","articles","volunteer","recipients","cookies","retention","rights","complaint","security","changes"];
function render(lang){const d=content[lang]||content.ar;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.title=d.title+" | AQ القانون";document.getElementById("languageLabel").textContent=d.language;document.getElementById("back").textContent=d.back;let html="<h1>"+d.title+"</h1><p class='notice'>"+d.updated+"</p>";for(const key of order){if(key==="intro")html+="<p>"+d[key]+"</p>";else if(key==="complaint")html+="<h2>"+d[key]+"</h2><p>"+d.complaintText+" <a href='https://autoriteitpersoonsgegevens.nl/'>autoriteitpersoonsgegevens.nl</a>.</p>";else html+="<h2>"+d[key]+"</h2><p>"+d[key+"Text"]+"</p>"}document.getElementById("policy").innerHTML=html;document.getElementById("language").value=lang}
const params=new URLSearchParams(location.search);const requested=params.get("lang");const initial=["ar","nl","en"].includes(requested)?requested:(["nl","en"].includes(navigator.language.slice(0,2))?navigator.language.slice(0,2):"ar");render(initial);document.getElementById("language").addEventListener("change",e=>{const lang=e.target.value;render(lang);history.replaceState(null,"",location.pathname+"?lang="+lang)});
</script>
