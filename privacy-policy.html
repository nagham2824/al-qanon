const content={
ar:{title:"سياسة الخصوصية",updated:"آخر تحديث: 1 نوفمبر 2026",intro:"توضح هذه السياسة البيانات التي قد تُعالج عند استخدام منصة القانون AQ، وأسباب ذلك، وكيفية التواصل بشأن الخصوصية. المنصة تقدّم معلومات قانونية عامة وليست مكتب محاماة.",controller:"1. الجهة المسؤولة والتواصل",controllerText:"المسؤولة عن المنصة ومعالجة البيانات هي نور أدهم دليقان (Nour Adham Dlikan)، بصفتها فردًا. لطلبات الخصوصية أو الاستفسارات: nour.dlikan@gmail.com.",data:"2. البيانات التي قد نعالجها",dataText:"عند إرسال مقال عبر نموذج الزوار، نعالج عنوان المقال ونصه والقسم واللغة والاسم الاختياري وحالة المراجعة، وقد تضيف الإدارة رابط المصدر. إذا راسلتنا بشأن التطوع، تصل رسالتك وأي سيرة ذاتية ترفقها إلى صندوق البريد الإلكتروني للمشرفة؛ ولا يرسل الموقع الرسالة أو يخزنها بنفسه. وبالنسبة إلى المتطوعين الذين تُنشأ لهم عضوية، نعالج الاسم وحالة العضوية وتواريخ الإنشاء والتفعيل وتسجيل الدخول ومعرّف الحساب المرتبط. تُدار كلمات المرور بواسطة خدمة المصادقة لدى Supabase. وعند إرسال المتطوع مقالاً، نعالج عنوانه ونصه والقسم واللغة ورابط المصدر إن وُجد، ونربطه بحساب المتطوع وحالة المراجعة.",purposes:"3. الأغراض والأساس القانوني",purposesText:"نستخدم البيانات اللازمة لمراجعة المساهمات ونشر المقالات وإدارة طلبات التطوع والرد على الاستفسارات وحماية المنصة. بحسب الحالة، قد يكون الأساس القانوني تنفيذ خطوات طلبتها، أو المصلحة المشروعة في إدارة منصة آمنة ومفيدة، أو موافقتك عندما تكون مطلوبة. سنطلب توضيحًا أو موافقة إضافية إذا تطلب القانون ذلك.",articles:"4. المقالات والمراجعة",articlesText:"المقالات التي يرسلها الزوار تكون قيد المراجعة ولا تُنشر تلقائيًا. قد يطّلع المسؤول المخوّل على المقالات المقدّمة لإدارتها. نحذف المقالات المعلّقة أو المرفوضة يدويًا عادةً خلال 7–15 يومًا؛ لا يوجد حذف آلي حاليًا. تبقى المقالات المنشورة ما دامت مفيدة ودقيقة، وتُراجع أو تُحدّث أو تُزال عند الحاجة. لا ترسل معلومات شخصية حساسة أو بيانات تخص أشخاصًا آخرين دون أساس مناسب.",volunteer:"5. عضويات المتطوعين وحساباتهم",volunteerText:"يمكن للمهتمين بالتطوع مراسلة المشرفة نور مباشرة عبر البريد الإلكتروني وإرفاق سيرتهم الذاتية. تُستخدم الرسائل والمرفقات التي تختار إرسالها للرد على الاستفسار وتقييم طلب المساهمة. لا يستقبل الموقع هذه الرسائل عبر نموذج ولا يخزنها في قاعدة بياناته. أما عضويات المتطوعين، فتنشئها المشرفة وتمنح المتطوع رمزاً لمرة واحدة لتفعيل الحساب. تُستخدم بيانات العضوية لإدارة الوصول وتنظيم المساهمات، ويمكن للمتطوع بعد التفعيل تسجيل الدخول وإرسال مقالات للمراجعة؛ ولا تُنشر هذه المقالات تلقائياً. يمكن للمشرفة تعليق العضوية عند الحاجة.",recipients:"6. الخدمات الخارجية ومشاركة البيانات",recipientsText:"تستخدم المنصة خدمات خارجية لتشغيل وظائفها، منها Supabase لاستضافة قاعدة البيانات والمصادقة، وjsDelivr لتحميل مكتبة برمجية، وGoogle Fonts للخطوط، وUnsplash لعرض الصور. عند تحميل موارد من هذه الخدمات، قد تتلقى الجهة المزودة بيانات تقنية مثل عنوان IP ومعلومات المتصفح والطلب. تُعالج البيانات داخل الخدمات وفق إعداداتها وشروطها وسياساتها. لا نبيع البيانات ولا نستخدم حاليًا أدوات تحليل إعلاني مقصودة مثل Google Analytics. لا نشارك البيانات الشخصية مع جهات أخرى إلا عند الحاجة لتشغيل المنصة أو وجود أساس قانوني.",cookies:"7. ملفات تعريف الارتباط والتخزين المحلي",cookiesText:"قد تستخدم خدمات المصادقة لدى Supabase وتطبيق المنصة مساحة تخزين المتصفح للحفاظ على جلسات دخول الإدارة والمتطوعين. كما تُستخدم مساحة تخزين الجلسة لحفظ معلومات انتهاء جلسة المتطوع. لم نضف عمداً أدوات تتبع إعلاني أو تحليلات. قد يؤدي حذف بيانات المتصفح إلى تسجيل الخروج.",retention:"8. مدة الاحتفاظ",retentionText:"نحتفظ بالبيانات فقط للمدة اللازمة للأغراض الموضحة أعلاه، مع مراعاة الالتزامات القانونية وحل النزاعات وحماية المنصة. لا توجد حالياً آلية حذف تلقائي مفعّلة للمقالات أو سجلات العضويات. وتُراجع رسائل التطوع وطلبات الحذف والاحتفاظ يدوياً عبر جهة التواصل المذكورة في هذه السياسة.",rights:"9. حقوقك",rightsText:"بحسب القانون المنطبق، قد يحق لك طلب الوصول إلى بياناتك أو تصحيحها أو حذفها أو تقييد معالجتها أو الاعتراض عليها، وسحب الموافقة عندما تكون المعالجة قائمة عليها، وطلب نقل البيانات حيث ينطبق ذلك. أرسل طلبك إلى البريد المذكور أعلاه. قد نطلب معلومات معقولة للتحقق من هويتك، وقد لا يمكن تنفيذ الحذف إذا أوجب القانون الاحتفاظ ببعض البيانات.",complaint:"10. الشكاوى",complaintText:"إذا كنت في هولندا، يمكنك تقديم شكوى إلى هيئة حماية البيانات الهولندية Autoriteit Persoonsgegevens عبر",security:"11. أمن البيانات",securityText:"نستخدم ضوابط تقنية وتنظيمية مناسبة بحسب طبيعة المنصة، لكن لا يمكن ضمان أمن مطلق لأي خدمة عبر الإنترنت. لا ترسل كلمات مرور أو معلومات حساسة ضمن المقالات أو رسائل التطوع.",changes:"12. تحديث السياسة",changesText:"قد نحدّث هذه السياسة عند تغير المنصة أو المتطلبات القانونية. سننشر النسخة المحدّثة في هذه الصفحة مع تعديل تاريخ التحديث.",back:"العودة إلى المنصة",language:"اللغة"},
nl:{title:"Privacyverklaring",updated:"Laatst bijgewerkt: 1 november 2026",intro:"Deze verklaring beschrijft welke gegevens bij gebruik van AQ Juridisch kunnen worden verwerkt, waarom dat gebeurt en hoe u contact kunt opnemen over privacy. Het platform biedt algemene juridische informatie en is geen advocatenkantoor.",controller:"1. Verantwoordelijke en contact",controllerText:"De verantwoordelijke voor het platform en de gegevensverwerking is Nour Adham Dlikan, handelend als particulier. Voor privacyverzoeken of vragen: nour.dlikan@gmail.com.",data:"2. Welke gegevens kunnen worden verwerkt",dataText:"Bij een artikelinzending via het bezoekersformulier verwerken we de titel, tekst, categorie, taal, eventueel ingevulde naam en beoordelingsstatus. Een beheerder kan de bronlink toevoegen. Als u ons over vrijwilligerswerk e-mailt, komen uw bericht en eventuele cv-bijlage in de mailbox van de beheerder terecht; de website verstuurt of bewaart die e-mail niet zelf. Voor vrijwilligers met een aangemaakt lidmaatschap verwerken we de naam, lidmaatschapsstatus, aanmaak-, activatie- en inlogtijden en de gekoppelde account-ID. Wachtwoorden worden beheerd door de authenticatiedienst van Supabase. Wanneer een vrijwilliger een artikel indient, verwerken we de titel, tekst, categorie, taal en eventuele bronlink en koppelen we dit aan het vrijwilligersaccount en de beoordelingsstatus.",purposes:"3. Doeleinden en rechtsgrond",purposesText:"We verwerken gegevens die nodig zijn om bijdragen te beoordelen en te publiceren, vrijwilligersaanvragen te beheren, vragen te beantwoorden en het platform te beveiligen. Afhankelijk van de situatie is de rechtsgrond het uitvoeren van stappen op uw verzoek, ons gerechtvaardigd belang bij een veilig en nuttig platform, of uw toestemming wanneer die vereist is. Waar de wet dat verlangt, vragen we om aanvullende informatie of toestemming.",articles:"4. Artikelen en beoordeling",articlesText:"Door bezoekers ingezonden artikelen staan ter beoordeling en worden niet automatisch gepubliceerd. Een bevoegde beheerder kan inzendingen bekijken om ze te beheren. Concepten en afgewezen artikelen worden handmatig doorgaans binnen 7–15 dagen verwijderd; automatische verwijdering is momenteel niet ingericht. Gepubliceerde artikelen blijven beschikbaar zolang ze nuttig en actueel zijn en worden zo nodig beoordeeld, bijgewerkt of verwijderd. Stuur geen gevoelige persoonsgegevens of gegevens van anderen zonder passende grondslag.",volunteer:"5. Vrijwilligerslidmaatschappen en accounts",volunteerText:"Mensen die vrijwilliger willen worden, kunnen beheerder Noor rechtstreeks e-mailen en hun cv bijvoegen. Berichten en bijlagen die u zelf verstuurt, worden gebruikt om uw vraag te beantwoorden en uw mogelijke bijdrage te beoordelen. De website ontvangt of bewaart deze e-mails niet via een formulier. Vrijwilligerslidmaatschappen worden afzonderlijk door de beheerder aangemaakt; de vrijwilliger ontvangt een eenmalige code om het account te activeren. Na activatie kan de vrijwilliger inloggen en artikelen ter beoordeling indienen. Deze artikelen worden niet automatisch gepubliceerd. De beheerder kan een lidmaatschap indien nodig opschorten.",recipients:"6. Externe diensten en gegevensdeling",recipientsText:"Het platform gebruikt externe diensten, waaronder Supabase voor database en authenticatie, jsDelivr voor het laden van een softwarebibliotheek, Google Fonts voor lettertypen en Unsplash voor afbeeldingen. Bij het laden van bronnen kunnen deze aanbieders technische gegevens ontvangen, zoals IP-adres, browserinformatie en aanvraaggegevens. Verwerking door deze aanbieders valt mede onder hun eigen instellingen, voorwaarden en privacyverklaringen. We verkopen geen gegevens en hebben momenteel geen opzettelijke advertentie- of analysetrackers zoals Google Analytics toegevoegd. We delen persoonsgegevens niet met anderen, behalve waar dat nodig is voor de werking van het platform of een rechtsgrond bestaat.",cookies:"7. Cookies en lokale opslag",cookiesText:"De authenticatiediensten van Supabase en het platform kunnen browseropslag gebruiken om beheerders- en vrijwilligerssessies te bewaren. Session storage wordt ook gebruikt om het verlopen van de vrijwilligerssessie bij te houden. We hebben bewust geen advertentietracking of analysetools toegevoegd. Het wissen van browsergegevens kan u uitloggen.",retention:"8. Bewaartermijnen",retentionText:"We bewaren gegevens niet langer dan nodig is voor de genoemde doeleinden, rekening houdend met wettelijke verplichtingen, geschillen en beveiliging. Er is momenteel geen automatische verwijdering ingesteld voor artikelen of lidmaatschapsgegevens. Vrijwilligersmails en verzoeken over verwijdering en bewaartermijnen worden handmatig beoordeeld via het contactadres in deze verklaring.",rights:"9. Uw rechten",rightsText:"Afhankelijk van het toepasselijke recht kunt u recht hebben op inzage, rectificatie, verwijdering, beperking, bezwaar, intrekking van toestemming wanneer daarop wordt gebaseerd, en gegevensoverdraagbaarheid waar van toepassing. Stuur uw verzoek naar het hierboven vermelde e-mailadres. We kunnen redelijke informatie vragen om uw identiteit te verifiëren. Verwijdering is niet altijd mogelijk als gegevens wettelijk moeten worden bewaard.",complaint:"10. Klachten",complaintText:"Als u in Nederland bent, kunt u een klacht indienen bij de Autoriteit Persoonsgegevens via",security:"11. Beveiliging",securityText:"We nemen passende technische en organisatorische maatregelen, rekening houdend met de aard van het platform. Absolute beveiliging van een onlinedienst kan niet worden gegarandeerd. Stuur geen wachtwoorden of gevoelige informatie via artikelen of vrijwilligersberichten.",changes:"12. Wijzigingen",changesText:"We kunnen deze verklaring aanpassen wanneer het platform of de wettelijke vereisten veranderen. De bijgewerkte versie wordt op deze pagina gepubliceerd met een nieuwe datum.",back:"Terug naar het platform",language:"Taal"},
en:{title:"Privacy Policy",updated:"Last updated: 1 November 2026",intro:"This policy explains what information may be processed when using AQ Law, why it is processed, and how to contact us about privacy. The platform provides general legal information and is not a law firm.",controller:"1. Controller and contact",controllerText:"The person responsible for the platform and its data processing is Nour Adham Dlikan, acting as an individual. For privacy requests or questions: nour.dlikan@gmail.com.",data:"2. Information we may process",dataText:"When an article is submitted through the visitor form, we process its title, text, category, language, any optional name, and review status. An administrator may add the source link. If you email us about volunteering, your message and any CV attachment are received in the administrator's email inbox; the website does not send or store that email itself. For volunteers with a membership, we process the volunteer's name, membership status, creation, activation and login timestamps, and linked account identifier. Passwords are managed by Supabase's authentication service. When a volunteer submits an article, we process its title, text, category, language and any source link, and associate it with the volunteer account and review status.",purposes:"3. Purposes and legal basis",purposesText:"We process information needed to review and publish contributions, manage volunteer applications, answer enquiries and protect the platform. Depending on the circumstances, the legal basis may be taking steps at your request, our legitimate interest in operating a useful and secure platform, or your consent where required. We will seek further information or consent where the law requires it.",articles:"4. Articles and review",articlesText:"Visitor-submitted articles are pending review and are not published automatically. An authorised administrator may access submissions to manage them. Pending and rejected articles are usually deleted manually within 7–15 days; automatic deletion is not currently configured. Published articles remain available while useful and accurate, and are reviewed, updated or removed when needed. Do not submit sensitive personal information or information about other people without an appropriate basis.",volunteer:"5. Volunteer memberships and accounts",volunteerText:"People interested in volunteering can email administrator Noor directly and attach their CV. Messages and attachments you choose to send are used to respond to your enquiry and assess your potential contribution. The website does not receive or store these emails through a form. Volunteer memberships are created separately by the administrator, who issues a one-time code for account activation. After activation, volunteers can sign in and submit articles for review; submissions are not published automatically. The administrator may suspend a membership when necessary.",recipients:"6. Third-party services and sharing",recipientsText:"The platform uses external services, including Supabase for database hosting and authentication, jsDelivr to load a software library, Google Fonts for fonts, and Unsplash for images. When resources are requested, these providers may receive technical data such as IP address, browser information and request details. Their processing is also governed by their own settings, terms and privacy notices. We do not sell personal data and have not intentionally added advertising or analytics trackers such as Google Analytics. We do not share personal data with others except where needed to operate the platform or where a legal basis applies.",cookies:"7. Cookies and local storage",cookiesText:"Supabase authentication services and the platform may use browser storage to maintain administrator and volunteer login sessions. Session storage is also used to track volunteer-session expiry. We have not intentionally added advertising trackers or analytics tools. Clearing browser data may sign you out.",retention:"8. Retention",retentionText:"We keep information only as long as needed for the purposes described above, taking account of legal obligations, disputes and platform security. Automatic deletion is not currently configured for articles or membership records. Volunteer emails and requests concerning deletion and retention are reviewed manually through the contact address in this policy.",rights:"9. Your rights",rightsText:"Depending on applicable law, you may have rights to access, correct, erase or restrict processing of your data, object to processing, withdraw consent where processing relies on it, and request portability where applicable. Send requests to the email address above. We may ask for reasonable information to verify your identity. Erasure may not be possible where the law requires certain data to be retained.",complaint:"10. Complaints",complaintText:"If you are in the Netherlands, you may lodge a complaint with the Dutch Data Protection Authority (Autoriteit Persoonsgegevens) at",security:"11. Security",securityText:"We use appropriate technical and organisational measures for the nature of the platform, but no online service can guarantee absolute security. Do not include passwords or sensitive information in article submissions or volunteer messages.",changes:"12. Changes to this policy",changesText:"We may update this policy as the platform or legal requirements change. The revised version will be published on this page with an updated date.",back:"Back to the platform",language:"Language"},
tr:{"title":"Gizlilik Politikası","updated":"Son güncelleme: 1 Kasım 2026","intro":"Bu politika, AQ Law platformunu kullanırken hangi bilgilerin işlenebileceğini, bunun nedenlerini ve gizlilik konularında bizimle nasıl iletişime geçebileceğinizi açıklar. Platform genel hukuki bilgi sunar; bir hukuk bürosu değildir.","controller":"1. Veri sorumlusu ve iletişim","controllerText":"Platformdan ve veri işlemeden sorumlu kişi, bireysel olarak hareket eden Nour Adham Dlikan'dır. Gizlilik talepleri veya sorular için: nour.dlikan@gmail.com.","data":"2. İşlenebilecek bilgiler","dataText":"Ziyaretçi formu üzerinden makale gönderildiğinde başlık, metin, kategori, dil, isteğe bağlı ad ve inceleme durumu işlenir; yönetici kaynak bağlantısı ekleyebilir. Gönüllülük hakkında bize e-posta gönderirseniz mesajınız ve eklediğiniz özgeçmiş yöneticinin e-posta gelen kutusuna ulaşır; web sitesi bu e-postayı kendisi göndermez veya saklamaz. Üyelik oluşturulan gönüllüler için ad, üyelik durumu, oluşturulma, etkinleştirilme ve giriş zamanları ile bağlı hesap kimliği işlenir. Şifreler Supabase kimlik doğrulama hizmeti tarafından yönetilir. Gönüllü makale gönderdiğinde başlık, metin, kategori, dil ve varsa kaynak bağlantısı işlenir; gönderi gönüllü hesabı ve inceleme durumuyla ilişkilendirilir.","purposes":"3. Amaçlar ve hukuki dayanak","purposesText":"Bilgileri katkıları incelemek ve yayımlamak, gönüllü üyeliklerini yönetmek, soruları yanıtlamak ve platformu korumak için gerekli olduğu ölçüde işleriz. Duruma göre hukuki dayanak, talebiniz üzerine gerekli adımların atılması, güvenli ve yararlı bir platform işletmeye yönelik meşru menfaatimiz veya gerektiğinde verdiğiniz onay olabilir. Kanun gerektiriyorsa ek bilgi veya onay isteriz.","articles":"4. Makaleler ve inceleme","articlesText":"Ziyaretçiler tarafından gönderilen makaleler inceleme bekler ve otomatik olarak yayımlanmaz. Yetkili yönetici gönderileri yönetmek için görüntüleyebilir. Bekleyen veya reddedilen makaleler genellikle 7–15 gün içinde manuel olarak silinir; şu anda otomatik silme ayarlanmamıştır. Yayımlanan makaleler yararlı ve doğru kaldıkları sürece erişilebilir olur; gerektiğinde incelenir, güncellenir veya kaldırılır. Uygun bir hukuki dayanak olmadan hassas kişisel verileri veya başkalarına ait bilgileri göndermeyin.","volunteer":"5. Gönüllü üyelikleri ve hesapları","volunteerText":"Gönüllü olmak isteyen kişiler yönetici Noor'a doğrudan e-posta gönderebilir ve özgeçmişlerini ekleyebilir. Göndermeyi seçtiğiniz mesajlar ve ekler, sorunuzu yanıtlamak ve olası katkınızı değerlendirmek için kullanılır. Web sitesi bu e-postaları bir form aracılığıyla almaz veya saklamaz. Gönüllü üyelikleri yönetici tarafından ayrı olarak oluşturulur ve hesap etkinleştirmesi için tek kullanımlık bir kod verilir. Etkinleştirmeden sonra gönüllüler giriş yapabilir ve incelenmek üzere makale gönderebilir; gönderiler otomatik olarak yayımlanmaz. Yönetici gerektiğinde üyeliği askıya alabilir.","recipients":"6. Üçüncü taraf hizmetler ve veri paylaşımı","recipientsText":"Platform, veritabanı ve kimlik doğrulama için Supabase, yazılım kütüphanesi yüklemek için jsDelivr, yazı tipleri için Google Fonts ve görseller için Unsplash gibi harici hizmetler kullanır. Kaynaklar yüklendiğinde bu sağlayıcılar IP adresi, tarayıcı bilgileri ve istek ayrıntıları gibi teknik veriler alabilir. Sağlayıcıların veri işlemesi kendi ayarlarına, koşullarına ve gizlilik bildirimlerine de tabidir. Kişisel verileri satmayız ve şu anda Google Analytics gibi reklam veya analiz izleyicilerini bilerek eklemedik. Kişisel verileri yalnızca platformun çalışması için gerektiğinde veya hukuki bir dayanak bulunduğunda paylaşırız.","cookies":"7. Çerezler ve yerel depolama","cookiesText":"Supabase kimlik doğrulama hizmetleri ve platform, yönetici ve gönüllü oturumlarını sürdürmek için tarayıcı depolamasını kullanabilir. Gönüllü oturumunun sona erme zamanını izlemek için oturum depolaması da kullanılır. Bilerek reklam takibi veya analiz araçları eklemedik. Tarayıcı verilerini silmek oturumunuzu kapatabilir.","retention":"8. Saklama süreleri","retentionText":"Bilgileri, yasal yükümlülükleri, uyuşmazlıkları ve platform güvenliğini dikkate alarak yalnızca yukarıda açıklanan amaçlar için gerekli süre boyunca saklarız. Makaleler veya üyelik kayıtları için şu anda otomatik silme yapılandırılmamıştır. Gönüllülük e-postaları ile silme ve saklama talepleri bu politikada belirtilen iletişim adresi üzerinden manuel olarak değerlendirilir.","rights":"9. Haklarınız","rightsText":"Uygulanabilir hukuka bağlı olarak verilerinize erişme, düzeltme, silme veya işlemeyi kısıtlama, işlemeye itiraz etme, işleme onaya dayanıyorsa onayı geri çekme ve uygun olduğu durumlarda veri taşınabilirliği talep etme haklarınız olabilir. Talebinizi yukarıdaki e-posta adresine gönderin. Kimliğinizi doğrulamak için makul bilgiler isteyebiliriz. Kanunen saklanması gereken verilerin silinmesi mümkün olmayabilir.","complaint":"10. Şikâyetler","complaintText":"Hollanda'daysanız Hollanda Veri Koruma Kurumu Autoriteit Persoonsgegevens'e şu adresten şikâyette bulunabilirsiniz:","security":"11. Veri güvenliği","securityText":"Platformun niteliğine uygun teknik ve idari önlemler kullanırız; ancak hiçbir çevrimiçi hizmet mutlak güvenlik garanti edemez. Makale gönderilerine veya gönüllü mesajlarına şifre ya da hassas bilgi eklemeyin.","changes":"12. Bu politikadaki değişiklikler","changesText":"Platform veya yasal gereklilikler değiştikçe bu politikayı güncelleyebiliriz. Güncellenmiş sürüm yeni tarih ile bu sayfada yayımlanır.","back":"Platforma dön","language":"Dil"}
};
const order=["intro","controller","data","purposes","articles","volunteer","recipients","cookies","retention","rights","complaint","security","changes"];
function render(lang){const d=content[lang]||content.ar;document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.title=d.title+" | AQ القانون";document.getElementById("languageLabel").textContent=d.language;document.getElementById("back").textContent=d.back;let html="<h1>"+d.title+"</h1><p class='notice'>"+d.updated+"</p>";for(const key of order){if(key==="intro")html+="<p>"+d[key]+"</p>";else if(key==="complaint")html+="<h2>"+d[key]+"</h2><p>"+d.complaintText+" <a href='https://autoriteitpersoonsgegevens.nl/'>autoriteitpersoonsgegevens.nl</a>.</p>";else html+="<h2>"+d[key]+"</h2><p>"+d[key+"Text"]+"</p>"}document.getElementById("policy").innerHTML=html;document.getElementById("language").value=lang}
const params=new URLSearchParams(location.search);const requested=params.get("lang");const initial=["ar","nl","en","tr"].includes(requested)?requested:(["nl","en","tr"].includes(navigator.language.slice(0,2))?navigator.language.slice(0,2):"ar");render(initial);document.getElementById("language").addEventListener("change",e=>{const lang=e.target.value;render(lang);history.replaceState(null,"",location.pathname+"?lang="+lang)});
</script>
