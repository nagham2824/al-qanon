ar:{
title:"سياسة الخصوصية",updated:"آخر تحديث: 1 نوفمبر 2026",language:"اللغة",back:"العودة إلى المنصة",logoAlt:"شعار منصة القانون AQ",
sections:[
["intro","توضح هذه السياسة كيفية تعامل منصة القانون AQ مع البيانات الشخصية عند زيارة الموقع أو استخدام خدماته. تقدم المنصة معلومات قانونية عامة، وليست مكتب محاماة ولا تقدم استشارات قانونية فردية."],
["controller","المسؤولة عن المنصة ومعالجة البيانات هي نور أدهم دليقان (Nour Adham Dlikan)، بصفتها فردًا. لطلبات الخصوصية أو الاستفسارات، يرجى التواصل عبر البريد الإلكتروني: nour.dlikan@gmail.com."],
["data","عند زيارة الموقع، قد تُعالج بيانات تقنية ضرورية لتقديم الصفحات وحمايتها، مثل عنوان IP ومعلومات المتصفح ووقت الطلب، وذلك من خلال خدمات الاستضافة والمزودين الخارجيين. لا يتيح الموقع حاليًا نموذجًا للزوار لإرسال المقالات. ويمكن للزوار قراءة المقالات المنشورة فقط. إذا تواصلت معنا بشأن التطوع عبر البريد الإلكتروني، فسنتلقى الرسالة وأي سيرة ذاتية تختار إرفاقها في صندوق البريد الإلكتروني للمشرفة. وبالنسبة إلى المتطوعين، قد نعالج الاسم الظاهر، وحالة العضوية، ومعرّف الحساب، وأوقات إنشاء العضوية وتفعيلها وتسجيل الدخول وانتهاء الجلسة. تُدار كلمات المرور بواسطة خدمة المصادقة لدى Supabase ولا نخزنها كنص مقروء. ولحماية تسجيل الدخول من المحاولات المتكررة، تُستخدم معرّفات تجزئة (hashes) لعنوان IP ورمز العضوية مع أوقات المحاولات؛ ولا يُخزّن عنوان IP الخام في جدول تحديد المحاولات. وعندما يرسل متطوع مقالًا، نعالج عنوان المقال ونصه والقسم واللغة ورابط المصدر إن وُجد، ونربطه بعضوية المتطوع وحالة المراجعة."],
["purposes","نعالج البيانات لتشغيل الموقع، وعرض المقالات المنشورة، وإدارة عضويات المتطوعين، واستلام مساهماتهم ومراجعتها، والرد على الرسائل، وحماية المنصة ومنع إساءة الاستخدام. بحسب الحالة، يستند ذلك إلى تنفيذ خطوات طلبتها، أو إلى مصلحتنا المشروعة في تشغيل منصة آمنة ومفيدة، أو إلى موافقتك عندما تكون مطلوبة."],
["articles","إرسال المقالات متاح للمتطوعين الذين فعّلت لهم المشرفة عضوية. يُحفظ المقال المرسل بحالة «بانتظار المراجعة»، ولا يُنشر تلقائيًا. تتولى المشرفة نور مراجعة المقال واتخاذ قرار نشره أو رفضه أو تعديله أو حذفه. لا يستطيع الزائر إرسال مقال أو نشره من الموقع. قد تتضمن المقالات المنشورة اسم الكاتب أو رابط المصدر بحسب ما يظهر في المقال. لا ترسل كلمات مرور أو بيانات شخصية حساسة أو معلومات تخص أشخاصًا آخرين دون أساس قانوني مناسب."],
["volunteer","يمكن للراغبين بالتطوع مراسلة المشرفة نور مباشرة عبر البريد الإلكتروني وإرفاق سيرتهم الذاتية. تُستخدم الرسائل والمرفقات للرد على الطلب وتقييم إمكانية المساهمة. لا يستقبل الموقع هذه الرسائل عبر نموذج ولا يخزنها في قاعدة بيانات المقالات. تنشئ المشرفة عضويات المتطوعين وتمنحهم رمزًا لمرة واحدة لتفعيل الحساب. بعد التفعيل، يستطيع المتطوع تسجيل الدخول وإرسال مقالات للمراجعة، لكنه لا يستطيع نشرها بنفسه. يمكن تعليق العضوية عند الحاجة."],
["recipients","تستخدم المنصة خدمات خارجية لتشغيل الموقع، ومنها GitHub Pages لاستضافة صفحات الموقع، وSupabase لاستضافة قاعدة البيانات والمصادقة والوظائف الخلفية، وjsDelivr لتحميل مكتبة برمجية، وGoogle Fonts للخطوط، وUnsplash لبعض الصور، وخدمات البريد الإلكتروني لدى Google عندما تراسلنا عبر عنوان Gmail. قد تتلقى هذه الجهات بيانات تقنية مثل عنوان IP ومعلومات المتصفح وبيانات الطلب، بحسب الخدمة المستخدمة. تخضع المعالجة أيضًا لإعدادات كل مزود وشروطه وإشعار الخصوصية الخاص به. لا نبيع البيانات الشخصية. وقد تتم معالجة بعض البيانات خارج المنطقة الاقتصادية الأوروبية وفق ترتيبات المزود والضمانات القانونية المنطبقة."],
["cookies","قد تستخدم المنصة وخدمة المصادقة لدى Supabase مساحة التخزين المحلية أو مساحة تخزين الجلسة في المتصفح للحفاظ على جلسات تسجيل الدخول وتذكّر انتهاء جلسة المتطوع. قد يؤدي حذف بيانات المتصفح إلى تسجيل الخروج. لا نضيف عمدًا أدوات تتبع إعلاني أو أدوات تحليل سلوكي إلى الموقع."],
["retention","نحتفظ بالبيانات للمدة اللازمة للأغراض الموضحة في هذه السياسة. لا توجد حاليًا آلية حذف تلقائي للمقالات أو سجلات العضويات؛ وتُراجع طلبات الحذف والاحتفاظ يدويًا. قد تُحذف سجلات محاولات تسجيل الدخول القديمة تلقائيًا بعد فترة قصيرة لأغراض الحماية. وتبقى رسائل التطوع في صندوق البريد الإلكتروني إلى أن تُحذف وفق الحاجة. وقد يحتفظ مزودو الخدمات بسجلات تقنية وفق سياساتهم ومدد الاحتفاظ الخاصة بهم."],
["rights","بحسب القانون المنطبق، قد يحق لك طلب الوصول إلى بياناتك أو تصحيحها أو حذفها أو تقييد معالجتها أو الاعتراض عليها، وسحب الموافقة عندما تستند المعالجة إليها، وطلب نقل البيانات حيث ينطبق ذلك. لممارسة هذه الحقوق، أرسل طلبك إلى البريد الإلكتروني المذكور في قسم التواصل. قد نطلب معلومات معقولة للتحقق من هويتك، وقد توجد حالات قانونية تقتضي الاحتفاظ ببعض البيانات."],
["complaint","إذا كنت في هولندا، يمكنك تقديم شكوى إلى هيئة حماية البيانات الهولندية Autoriteit Persoonsgegevens عبر موقعها الرسمي: https://autoriteitpersoonsgegevens.nl/."],
["security","نستخدم ضوابط تقنية وتنظيمية مناسبة لطبيعة المنصة، لكن لا يمكن ضمان أمن مطلق لأي خدمة عبر الإنترنت. يرجى عدم إرسال كلمات المرور أو المعلومات الحساسة ضمن المقالات أو رسائل التطوع."],
["changes","قد نحدّث هذه السياسة عند تغير وظائف المنصة أو المتطلبات القانونية. سننشر النسخة المحدّثة في هذه الصفحة مع تعديل تاريخ آخر تحديث."]
]},
nl:{
title:"Privacyverklaring",updated:"Laatst bijgewerkt: 1 november 2026",language:"Taal",back:"Terug naar het platform",logoAlt:"Logo van AQ Law",
sections:[
["intro","Deze verklaring legt uit hoe AQ Law persoonsgegevens verwerkt wanneer u de website bezoekt of de diensten gebruikt. Het platform biedt algemene juridische informatie, is geen advocatenkantoor en geeft geen individueel juridisch advies."],
["controller","De verantwoordelijke voor het platform en de verwerking van persoonsgegevens is Nour Adham Dlikan, handelend als particulier. Voor privacyverzoeken of vragen kunt u contact opnemen via: nour.dlikan@gmail.com."],
["data","Bij uw bezoek kunnen technische gegevens worden verwerkt die nodig zijn om de website te leveren en te beveiligen, zoals IP-adres, browsergegevens en het tijdstip van een verzoek. Dit kan gebeuren via hostingdiensten en externe aanbieders. Bezoekers kunnen momenteel geen artikelen via een formulier indienen; zij kunnen alleen gepubliceerde artikelen lezen. Als u ons over vrijwilligerswerk e-mailt, ontvangen we uw bericht en een eventueel cv in de mailbox van de beheerder. Voor vrijwilligers kunnen we de weergavenaam, lidmaatschapsstatus, account-ID en tijdstippen van aanmaak, activatie, inloggen en sessieverloop verwerken. Wachtwoorden worden beheerd door de authenticatiedienst van Supabase en worden niet door ons als leesbare tekst opgeslagen. Om herhaalde inlogpogingen te beperken, gebruiken we gehashte aanduidingen van het IP-adres en de lidmaatschapscode met tijdstippen; het ruwe IP-adres wordt niet opgeslagen in de tabel voor pogingslimieten. Wanneer een vrijwilliger een artikel indient, verwerken we de titel, tekst, categorie, taal en eventuele bronlink en koppelen we deze aan het vrijwilligerslidmaatschap en de beoordelingsstatus."],
["purposes","We verwerken gegevens om de website te laten functioneren, gepubliceerde artikelen te tonen, vrijwilligerslidmaatschappen te beheren, bijdragen te ontvangen en te beoordelen, berichten te beantwoorden en het platform te beveiligen en misbruik te voorkomen. Afhankelijk van de situatie is de grondslag het uitvoeren van stappen op uw verzoek, ons gerechtvaardigd belang bij een veilig en nuttig platform, of uw toestemming wanneer die vereist is."],
["articles","Artikelen kunnen worden ingediend door vrijwilligers met een door de beheerder geactiveerd lidmaatschap. Een inzending krijgt de status ‘in afwachting van beoordeling’ en wordt niet automatisch gepubliceerd. Beheerder Noor beoordeelt het artikel en beslist over publicatie, afwijzing, aanpassing of verwijdering. Bezoekers kunnen via de website geen artikelen indienen of publiceren. Gepubliceerde artikelen kunnen, afhankelijk van de inhoud, de naam van de auteur of een bronverwijzing bevatten. Verstuur geen wachtwoorden, gevoelige persoonsgegevens of gegevens van anderen zonder passende wettelijke grondslag."],
["volunteer","Mensen die vrijwilliger willen worden, kunnen beheerder Noor rechtstreeks e-mailen en hun cv bijvoegen. Berichten en bijlagen worden gebruikt om op de aanvraag te reageren en een mogelijke bijdrage te beoordelen. De website ontvangt of bewaart deze e-mails niet via een formulier en slaat ze niet op in de artikeldatabase. De beheerder maakt vrijwilligerslidmaatschappen aan en verstrekt een eenmalige code om een account te activeren. Na activatie kan een vrijwilliger inloggen en artikelen ter beoordeling indienen, maar niet zelf publiceren. Een lidmaatschap kan indien nodig worden opgeschort."],
["recipients","Het platform gebruikt externe diensten, waaronder GitHub Pages voor websitehosting, Supabase voor database, authenticatie en backendfuncties, jsDelivr voor het laden van een softwarebibliotheek, Google Fonts voor lettertypen, Unsplash voor bepaalde afbeeldingen en de e-maildiensten van Google wanneer u ons via Gmail schrijft. Deze aanbieders kunnen technische gegevens ontvangen, zoals IP-adres, browserinformatie en aanvraaggegevens. Hun eigen instellingen, voorwaarden en privacyverklaringen zijn eveneens van toepassing. We verkopen geen persoonsgegevens. Sommige gegevens kunnen buiten de Europese Economische Ruimte worden verwerkt volgens de regelingen van de aanbieder en de toepasselijke wettelijke waarborgen."],
["cookies","De website en de authenticatiedienst van Supabase kunnen lokale browseropslag of sessieopslag gebruiken om inlogsessies te bewaren en het verlopen van een vrijwilligerssessie bij te houden. Het wissen van browsergegevens kan u uitloggen. We voegen niet bewust advertentietracking of gedragsgerichte analysetools toe."],
["retention","We bewaren gegevens niet langer dan nodig is voor de doeleinden in deze verklaring. Er is momenteel geen automatische verwijdering ingesteld voor artikelen of lidmaatschapsgegevens; verzoeken over verwijdering en bewaartermijnen worden handmatig beoordeeld. Oude registraties van inlogpogingen kunnen na een korte periode automatisch worden verwijderd voor beveiligingsdoeleinden. Vrijwilligersmails blijven in de mailbox totdat ze waar nodig worden verwijderd. Dienstverleners kunnen technische loggegevens bewaren volgens hun eigen beleid en bewaartermijnen."],
["rights","Afhankelijk van het toepasselijke recht kunt u recht hebben op inzage, rectificatie, verwijdering, beperking van verwerking, bezwaar, intrekking van toestemming wanneer daarop wordt gebaseerd, en gegevensoverdraagbaarheid waar van toepassing. Stuur uw verzoek naar het e-mailadres in het onderdeel Contact. We kunnen redelijke informatie vragen om uw identiteit te verifiëren. In bepaalde gevallen kan de wet vereisen dat gegevens worden bewaard."],
["complaint","Als u in Nederland bent, kunt u een klacht indienen bij de Autoriteit Persoonsgegevens via de officiële website: https://autoriteitpersoonsgegevens.nl/."],
["security","We nemen passende technische en organisatorische maatregelen, rekening houdend met de aard van het platform. Absolute beveiliging van een onlinedienst kan niet worden gegarandeerd. Verstuur geen wachtwoorden of gevoelige informatie via artikelen of vrijwilligersberichten."],
["changes","We kunnen deze verklaring aanpassen wanneer de functies van het platform of wettelijke vereisten veranderen. De bijgewerkte versie wordt met een nieuwe datum op deze pagina gepubliceerd."]
]},
en:{
title:"Privacy Policy",updated:"Last updated: 1 November 2026",language:"Language",back:"Back to the platform",logoAlt:"AQ Law platform logo",
sections:[
["intro","This policy explains how AQ Law processes personal data when you visit the website or use its services. The platform provides general legal information; it is not a law firm and does not provide individual legal advice."],
["controller","The person responsible for the platform and the processing of personal data is Nour Adham Dlikan, acting as an individual. For privacy requests or questions, contact: nour.dlikan@gmail.com."],
["data","When you visit the website, technical data needed to deliver and protect the pages may be processed, such as your IP address, browser information and request time, through hosting services and external providers. Visitors currently cannot submit articles through a form; they can only read published articles. If you email us about volunteering, your message and any CV you choose to attach are received in the administrator’s email inbox. For volunteers, we may process a display name, membership status, account identifier, and membership creation, activation, login and session-expiry times. Passwords are managed by Supabase Authentication and are not stored by us in readable form. To limit repeated login attempts, we use hashed identifiers derived from the IP address and membership code, together with attempt timestamps; the raw IP address is not stored in the rate-limit table. When a volunteer submits an article, we process its title, text, category, language and any source link, and associate it with the volunteer membership and review status."],
["purposes","We process data to operate the website, display published articles, manage volunteer memberships, receive and review contributions, respond to messages, secure the platform and prevent misuse. Depending on the circumstances, the legal basis may be taking steps at your request, our legitimate interest in operating a useful and secure platform, or your consent where required."],
["articles","Articles may be submitted by volunteers whose memberships have been activated by the administrator. A submission is assigned ‘pending review’ status and is not published automatically. Administrator Noor reviews each article and decides whether to publish, reject, amend or delete it. Visitors cannot submit or publish articles through the website. Published articles may include an author name or source link, depending on the content. Do not submit passwords, sensitive personal data or information about other people without an appropriate legal basis."],
["volunteer","People interested in volunteering can email administrator Noor directly and attach their CV. Messages and attachments are used to respond to the enquiry and assess a possible contribution. The website does not receive or store these emails through a form, and they are not stored in the articles database. The administrator creates volunteer memberships and provides a one-time code to activate an account. After activation, volunteers can sign in and submit articles for review, but cannot publish them themselves. A membership may be suspended when necessary."],
["recipients","The platform uses external services, including GitHub Pages for website hosting, Supabase for the database, authentication and backend functions, jsDelivr to load a software library, Google Fonts for fonts, Unsplash for certain images, and Google email services when you contact us through Gmail. These providers may receive technical data such as IP address, browser information and request details. Their own settings, terms and privacy notices also apply. We do not sell personal data. Some data may be processed outside the European Economic Area under the provider’s arrangements and applicable legal safeguards."],
["cookies","The website and Supabase Authentication may use local browser storage or session storage to maintain sign-in sessions and track volunteer-session expiry. Clearing browser data may sign you out. We do not intentionally add advertising trackers or behavioural analytics tools."],
["retention","We keep data only for as long as necessary for the purposes described in this policy. Automatic deletion is not currently configured for articles or membership records; deletion and retention requests are reviewed manually. Older login-attempt records may be deleted automatically after a short period for security purposes. Volunteer emails remain in the email inbox until deleted as appropriate. Service providers may retain technical logs under their own policies and retention periods."],
["rights","Depending on applicable law, you may have rights to access, correct, erase or restrict processing of your data, object to processing, withdraw consent where processing relies on it, and request portability where applicable. Send your request to the email address in the Contact section. We may ask for reasonable information to verify your identity. In some circumstances, the law may require certain data to be retained."],
["complaint","If you are in the Netherlands, you may lodge a complaint with the Dutch Data Protection Authority (Autoriteit Persoonsgegevens) through its official website: https://autoriteitpersoonsgegevens.nl/."],
["security","We use technical and organisational measures appropriate to the nature of the platform, but no online service can guarantee absolute security. Do not include passwords or sensitive information in article submissions or volunteer messages."],
["changes","We may update this policy when the platform’s features or legal requirements change. The updated version will be published on this page with a revised date."]
]},

["purposes","Verileri web sitesini işletmek, yayımlanmış makaleleri göstermek, gönüllü üyeliklerini yönetmek, katkıları almak ve incelemek, mesajları yanıtlamak, platformu güvenli tutmak ve kötüye kullanımı önlemek için işleriz. Duruma göre hukuki dayanak, talebiniz üzerine gerekli adımların atılması, güvenli ve yararlı bir platform işletmeye yönelik meşru menfaatimiz veya gerektiğinde verdiğiniz onay olabilir."],
["articles","Makaleler, yönetici tarafından üyeliği etkinleştirilmiş gönüllüler tarafından gönderilebilir. Gönderiler ‘inceleme bekliyor’ durumuna alınır ve otomatik olarak yayımlanmaz. Yönetici Noor her makaleyi inceler; yayımlama, reddetme, düzenleme veya silme kararını verir. Ziyaretçiler web sitesi üzerinden makale gönderemez veya yayımlayamaz. Yayımlanan makalelerde içeriğe bağlı olarak yazar adı veya kaynak bağlantısı bulunabilir. Uygun bir hukuki dayanak olmadan şifre, hassas kişisel veri veya başkalarına ait bilgileri göndermeyin."],
["volunteer","Gönüllü olmak isteyen kişiler yönetici Noor'a doğrudan e-posta gönderebilir ve özgeçmişlerini ekleyebilir. Mesajlar ve ekler başvuruyu yanıtlamak ve olası katkıyı değerlendirmek için kullanılır. Web sitesi bu e-postaları bir form aracılığıyla almaz veya saklamaz; makale veritabanında da tutulmaz. Yönetici gönüllü üyeliklerini oluşturur ve hesabın etkinleştirilmesi için tek kullanımlık kod verir. Etkinleştirmeden sonra gönüllüler giriş yapıp incelenmek üzere makale gönderebilir, ancak kendileri yayımlayamaz. Gerektiğinde üyelik askıya alınabilir."],
["recipients","Platform; web sitesi barındırma için GitHub Pages, veritabanı, kimlik doğrulama ve arka uç işlevleri için Supabase, yazılım kütüphanesi yüklemek için jsDelivr, yazı tipleri için Google Fonts, bazı görseller için Unsplash ve Gmail üzerinden bize ulaştığınızda Google e-posta hizmetlerini kullanır. Bu sağlayıcılar IP adresi, tarayıcı bilgileri ve istek ayrıntıları gibi teknik veriler alabilir. Sağlayıcıların kendi ayarları, koşulları ve gizlilik bildirimleri de geçerlidir. Kişisel verileri satmayız. Bazı veriler, sağlayıcıların düzenlemeleri ve geçerli yasal güvenceler kapsamında Avrupa Ekonomik Alanı dışında işlenebilir."],
["cookies","Web sitesi ve Supabase Kimlik Doğrulama, oturum açma durumunu korumak ve gönüllü oturumunun sona erme zamanını izlemek için tarayıcının yerel depolama veya oturum depolama alanını kullanabilir. Tarayıcı verilerini silmek oturumunuzu kapatabilir. Bilerek reklam izleyicileri veya davranışsal analiz araçları eklemiyoruz."],
["retention","Verileri yalnızca bu politikada açıklanan amaçlar için gerekli süre boyunca saklarız. Makaleler veya üyelik kayıtları için şu anda otomatik silme yapılandırılmamıştır; silme ve saklama talepleri manuel olarak değerlendirilir. Eski giriş denemesi kayıtları güvenlik amacıyla kısa bir süre sonra otomatik olarak silinebilir. Gönüllülük e-postaları gerektiğinde silinene kadar e-posta gelen kutusunda kalır. Hizmet sağlayıcıları teknik günlükleri kendi politikalarına ve saklama sürelerine göre tutabilir."],
["rights","Uygulanabilir hukuka bağlı olarak verilerinize erişme, düzeltme, silme veya işlemeyi kısıtlama, işlemeye itiraz etme, işleme onaya dayanıyorsa onayı geri çekme ve uygun olduğu durumlarda veri taşınabilirliği talep etme haklarınız olabilir. Talebinizi İletişim bölümünde belirtilen e-posta adresine gönderin. Kimliğinizi doğrulamak için makul bilgiler isteyebiliriz. Bazı durumlarda kanun belirli verilerin saklanmasını gerektirebilir."],
["complaint","Hollanda'daysanız Hollanda Veri Koruma Kurumu Autoriteit Persoonsgegevens'e resmi web sitesi üzerinden şikâyette bulunabilirsiniz: https://autoriteitpersoonsgegevens.nl/."],

nl:["Inleiding","Verwerkingsverantwoordelijke en contact","Gegevens die we verwerken","Doeleinden en rechtsgrond","Artikelen, beoordeling en publicatie","Vrijwilligersaanvragen en lidmaatschappen","Externe diensten en gegevensdeling","Cookies en lokale opslag","Bewaartermijnen","Uw rechten","Klachten","Beveiliging","Wijzigingen in deze verklaring"],
en:["Introduction","Controller and contact","Data we process","Purposes and legal basis","Articles, review and publication","Volunteer applications and memberships","Third-party services and data sharing","Cookies and local storage","Data retention","Your rights","Complaints","Data security","Changes to this policy"],
tr:["Giriş","Veri sorumlusu ve iletişim","İşlediğimiz veriler","Amaçlar ve hukuki dayanak","Makaleler, inceleme ve yayımlama","Gönüllü başvuruları ve üyelikleri","Üçüncü taraf hizmetler ve veri paylaşımı","Çerezler ve yerel depolama","Verilerin saklanma süresi","Haklarınız","Şikâyetler","Veri güvenliği","Politika değişiklikleri"]
};
function render(lang){
 const d=content[lang]||content.ar;
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==="ar"?"rtl":"ltr";
 document.title=d.title+" | AQ Law";
 document.getElementById("languageLabel").textContent=d.language;
 document.getElementById("back").textContent=d.back;
 document.getElementById("policyLogo").alt=d.logoAlt;
 const root=document.getElementById("policy");
 root.replaceChildren();
 const title=document.createElement("h1");title.textContent=d.title;root.appendChild(title);
 const updated=document.createElement("p");updated.className="notice";updated.textContent=d.updated;root.appendChild(updated);
 d.sections.forEach((section,index)=>{
   const heading=document.createElement("h2");heading.textContent=headings[lang][index];root.appendChild(heading);
   const paragraph=document.createElement("p");paragraph.textContent=section[1];
   if(section[0]==="complaint"){
     paragraph.textContent=section[1].replace("https://autoriteitpersoonsgegevens.nl/","");
     const link=document.createElement("a");link.href="https://autoriteitpersoonsgegevens.nl/";link.textContent="autoriteitpersoonsgegevens.nl";link.target="_blank";link.rel="noopener noreferrer";
     paragraph.appendChild(link);
     paragraph.appendChild(document.createTextNode("."));
   }
   root.appendChild(paragraph);
 });
 document.getElementById("language").value=lang;
}
const params=new URLSearchParams(location.search);
const requested=params.get("lang");
const browserLanguage=(navigator.language||"").slice(0,2).toLowerCase();
const initial=["ar","nl","en","tr"].includes(requested)?requested:(["ar","nl","en","tr"].includes(browserLanguage)?browserLanguage:"ar");
render(initial);
document.getElementById("language").addEventListener("change",event=>{
 const lang=event.target.value;render(lang);
 history.replaceState(null,"",location.pathname+"?lang="+lang);
});
</script>
