<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2033"><meta name="description" content="General Conditions — Al-Qanon AQ"><title>الشروط العامة | منصة القانون AQ</title><link rel="canonical" href="https://aq-law.nl/general-conditions.html"><style>:root{--navy:#0b2033;--gold:#d6aa5b;--ink:#142e40}*{box-sizing:border-box}body{margin:0;background:#f5f0e8;color:var(--ink);font:16px/1.9 system-ui,'Segoe UI',Tahoma,Arial,sans-serif}header{background:#0b2033;border-bottom:2px solid var(--gold);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px max(4%,calc((100% - 1120px)/2));flex-wrap:wrap}header a{color:#f6dcaa;text-decoration:none;font-weight:750;font-size:1.1rem}select{background:#15344e;color:white;border:1px solid #d6aa5b;border-radius:9px;padding:9px;font:inherit}main{width:min(1000px,calc(100% - 28px));margin:30px auto 56px}.hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 78% 0%,#244761,#0b2033 70%);border:1px solid #bd924b;border-radius:18px 18px 0 0;padding:clamp(24px,5vw,50px);color:#fff}.hero:after{content:"";position:absolute;inset:auto -10% -32px -10%;height:55px;border-top:2px solid #e0b96e;border-radius:50%;transform:rotate(-2deg);opacity:.75}.eyebrow{color:#e3b86c;font-size:.8rem;letter-spacing:.12em}.hero h1{font-size:clamp(1.8rem,4vw,3rem);line-height:1.35;color:#f5d494;margin:10px 0}.hero p{color:#e6eaf0;margin:0}.body{background:#fffdf8;border:1px solid #e7dac6;border-top:0;border-radius:0 0 18px 18px;padding:clamp(20px,5vw,48px);box-shadow:0 16px 38px #0b203315}section{border-bottom:1px solid #e9dfd0;padding:9px 0 20px;margin-bottom:12px}section:last-child{border:0}h2{font-size:1.13rem;color:#183a53;margin:12px 0 5px}p{margin:0;line-height:1.95}footer{background:#0b2033;border-top:2px solid var(--gold);color:#f4e6cf;text-align:center;padding:22px}footer a{color:#f1c778}a:focus-visible,select:focus-visible{outline:3px solid #d6aa5b;outline-offset:3px}@media(max-width:520px){header{padding:12px 16px}main{margin-top:16px}}</style></head><body><header><a href="/" aria-label="Al-Qanon AQ home">⚖️ AQ | القانون</a><label><span id="langLabel">اللغة</span> <select id="lang" aria-label="Language"><option value="ar">العربية</option><option value="nl">Nederlands</option><option value="en">English</option><option value="tr">Türkçe</option></select></label></header><main><div class="hero"><div class="eyebrow">AL-QANON AQ · GENERAL CONDITIONS</div><h1 id="heading"></h1><p id="subtitle"></p></div><article class="body" id="content"></article></main><footer>© 2026 AL-QANON AQ · <a href="privacy-policy.html" id="privacy"></a> · <a href="/" id="home"></a></footer><script>const titles={"ar":"الشروط العامة","nl":"Algemene Voorwaarden","en":"General Conditions","tr":"Genel Koşullar"};const data={"ar":[["التعريف بالمنصة","منصة القانون AQ منصة إلكترونية مستقلة لنشر المعرفة القانونية العامة وتعزيز الوعي بالحقوق والواجبات. وهي موجهة للطلاب والباحثين واللاجئين والمقيمين وغيرهم."],["طبيعة المعلومات","المحتوى تعليمي ومعلوماتي عام، ولا يُعد استشارة قانونية فردية. المنصة ليست مكتب محاماة، ولا تنشأ علاقة محامٍ وموكل باستخدامها. عند الحاجة، استشر مختصاً مؤهلاً."],["الاستخدام المقبول","يمكن للزوار قراءة المحتوى لأغراض مشروعة، مع احترام حقوق الآخرين. يُحظر تعطيل الموقع أو محاولة الوصول غير المصرح به إلى حساباته وأنظمته."],["الدقة والتحديث","تسعى المنصة إلى الدقة، لكن القوانين والإجراءات قد تتغير ويختلف تطبيقها حسب الحالة. يُرجى مراجعة المصادر الرسمية قبل اتخاذ قرارات قانونية مهمة."],["المقالات والمساهمات","الزوار العاديون لا يملكون صلاحية نشر المقالات. يقتصر تقديم المساهمات العلمية للنشر على المتطوعين المعتمدين. تخضع جميع المساهمات لمراجعة إدارة المنصة، وللإدارة وحدها قبولها أو تعديلها أو رفضها أو إلغاء نشرها. يضمن المساهم امتلاكه حقوق تقديم عمله، ولا يمنحه تقديم المقال حقاً تلقائياً في نشره."],["الملكية الفكرية","تظل الحقوق محفوظة لأصحابها وفق القانون والاتفاقات ذات الصلة. لا يجوز إعادة نشر المحتوى المحمي أو استغلاله تجارياً من دون إذن، إلا حيث يسمح القانون."],["اللغات والترجمات","تتيح المنصة العربية والهولندية والإنجليزية والتركية. الترجمات المساعدة قد تختلف عن النص الأصلي؛ وفيما يخص التشريعات والوثائق الرسمية، يُرجع إلى النص الرسمي المعتمد."],["المصادر الخارجية","قد تحتوي المنصة على روابط لمواقع خارجية. لا يعني إدراج الرابط اعتماد جميع محتويات الموقع الخارجي أو ضمان توفره."],["حدود المسؤولية","المعلومات عامة وقد لا تلائم كل حالة فردية. لا تستبعد هذه الشروط أي مسؤولية أو حقوق إلزامية لا يسمح القانون باستبعادها أو تقييدها."],["الخصوصية والتخزين","تُعالج البيانات الشخصية وفق سياسة الخصوصية والقانون المعمول به. وتُوضح ملفات الارتباط والتقنيات المشابهة، وتُطلب الموافقة حيث يلزم قانوناً."],["تعديل الشروط","قد تُحدّث الشروط عند الحاجة؛ تُنشر النسخة السارية وتاريخ تحديثها على الموقع."],["القانون المعمول به","تخضع هذه الشروط للقانون الهولندي مع مراعاة الأحكام الإلزامية لحماية المستخدمين والاختصاص القضائي."]],"nl":[["Over het platform","Al-Qanon AQ is een onafhankelijk online platform voor algemene juridische kennis en bewustwording van rechten en plichten, voor studenten, onderzoekers, vluchtelingen, inwoners en andere geïnteresseerden."],["Aard van de informatie","De inhoud dient uitsluitend algemene educatieve en informatieve doeleinden en vormt geen individueel juridisch advies. Het platform is geen advocatenkantoor; gebruik schept geen advocaat-cliëntrelatie. Raadpleeg zo nodig een gekwalificeerde jurist."],["Toegestaan gebruik","Bezoekers mogen de inhoud voor rechtmatige doeleinden lezen en moeten rechten van derden respecteren. Het verstoren van de website en onbevoegde toegang zijn verboden."],["Juistheid en actualiteit","Wij streven naar nauwkeurigheid, maar wetgeving en procedures kunnen veranderen en toepassing verschilt per situatie. Controleer officiële bronnen voordat u belangrijke juridische beslissingen neemt."],["Artikelen en bijdragen","Gewone bezoekers kunnen geen artikelen publiceren. Alleen erkende vrijwilligers mogen wetenschappelijke bijdragen ter beoordeling indienen. De platformbeheerder beoordeelt alle bijdragen en beslist exclusief over plaatsing, wijziging, afwijzing of verwijdering. De indiener moet over de benodigde rechten beschikken; indiening geeft geen automatisch recht op publicatie."],["Intellectuele eigendom","Rechten blijven bij de rechthebbenden overeenkomstig de wet en toepasselijke afspraken. Herpublicatie of commercieel gebruik van beschermde inhoud vereist toestemming, tenzij de wet dit toestaat."],["Talen en vertalingen","Het platform biedt Arabisch, Nederlands, Engels en Turks. Vertalingen kunnen afwijken van het origineel. Voor wetgeving en officiële documenten is de officiële authentieke tekst leidend."],["Externe bronnen","Links naar externe websites betekenen geen goedkeuring van alle externe inhoud of garantie van beschikbaarheid."],["Aansprakelijkheid","Informatie is algemeen en niet noodzakelijk geschikt voor iedere situatie. Wettelijk verplichte rechten en aansprakelijkheden worden niet uitgesloten of beperkt."],["Privacy en opslag","Persoonsgegevens worden verwerkt volgens het privacybeleid en toepasselijke wetgeving. Cookies en vergelijkbare technieken worden toegelicht; waar wettelijk vereist wordt toestemming gevraagd."],["Wijzigingen","Deze voorwaarden kunnen worden bijgewerkt. De geldende versie en de datum van de laatste wijziging staan op de website."],["Toepasselijk recht","Nederlands recht is van toepassing, onverminderd dwingende regels inzake gebruikersbescherming en rechterlijke bevoegdheid."]],"en":[["About the platform","Al-Qanon AQ is an independent online platform providing general legal knowledge and awareness of rights and obligations for students, researchers, refugees, residents and others."],["Nature of information","Content is for general educational and informational purposes only and is not individual legal advice. The platform is not a law firm, and using it creates no lawyer-client relationship. Seek qualified legal assistance when needed."],["Acceptable use","Visitors may read content for lawful purposes while respecting others' rights. Disrupting the website or attempting unauthorized access is prohibited."],["Accuracy and updates","We aim for accuracy, but laws and procedures may change and their application depends on individual circumstances. Check official sources before important legal decisions."],["Articles and contributions","Ordinary visitors cannot publish articles. Only approved volunteers may submit academic contributions for review. Platform management reviews all submissions and alone decides whether to publish, request edits, reject or unpublish content. Contributors must have the necessary rights; submission does not guarantee publication."],["Intellectual property","Rights remain with their respective owners under applicable law and agreements. Republishing protected content or exploiting it commercially requires permission unless allowed by law."],["Languages and translations","The platform offers Arabic, Dutch, English and Turkish. Translations may differ from original texts. For laws and official documents, consult the authoritative official version."],["External sources","Links to third-party websites do not imply endorsement of all their content or guarantee continued availability."],["Liability","Information is general and may not suit individual circumstances. Nothing in these conditions excludes or limits rights or liabilities that cannot lawfully be excluded or limited."],["Privacy and storage","Personal data is handled under the privacy policy and applicable law. Cookies and similar technologies are explained, and consent is requested where legally required."],["Changes","These conditions may be updated. The current version and its last-update date will be displayed on the website."],["Applicable law","Dutch law applies, subject to mandatory user-protection and jurisdiction rules."]],"tr":[["Platform hakkında","Al-Qanon AQ, öğrenciler, araştırmacılar, mülteciler, ülkede yaşayanlar ve diğer ilgililer için genel hukuk bilgisi ve haklar ile yükümlülükler konusunda farkındalık sunan bağımsız bir çevrim içi platformdur."],["Bilgilerin niteliği","İçerik yalnızca genel eğitim ve bilgilendirme amaçlıdır; kişiye özel hukuki danışmanlık değildir. Platform bir hukuk bürosu değildir ve kullanımı avukat-müvekkil ilişkisi oluşturmaz. Gerektiğinde yetkin bir hukuk uzmanına başvurun."],["Kabul edilebilir kullanım","Ziyaretçiler içeriği hukuka uygun amaçlarla okuyabilir ve başkalarının haklarına saygı göstermelidir. Siteyi aksatmak veya yetkisiz erişim girişiminde bulunmak yasaktır."],["Doğruluk ve güncellik","Doğruluk için çaba gösteririz; ancak yasalar ve usuller değişebilir ve uygulama kişisel koşullara göre farklılaşabilir. Önemli hukuki kararlar öncesinde resmî kaynakları kontrol edin."],["Makaleler ve katkılar","Sıradan ziyaretçiler makale yayımlayamaz. Yalnızca onaylı gönüllüler akademik katkıları incelemeye sunabilir. Tüm katkıları platform yönetimi değerlendirir; yayımlama, değişiklik isteme, reddetme veya yayından kaldırma kararı yalnızca yönetime aittir. Katkı sunan kişi gerekli haklara sahip olmalıdır; gönderim otomatik yayımlanma hakkı doğurmaz."],["Fikri mülkiyet","Haklar, geçerli hukuk ve anlaşmalara göre hak sahiplerinde kalır. Korunan içeriğin yeniden yayımlanması veya ticari kullanımı, kanunen izin verilmedikçe, izin gerektirir."],["Diller ve çeviriler","Platform Arapça, Felemenkçe, İngilizce ve Türkçe sunar. Çeviriler asıl metinden farklı olabilir. Yasalar ve resmî belgeler için yetkili resmî metin esas alınmalıdır."],["Dış kaynaklar","Üçüncü taraf sitelere bağlantılar, içeriklerinin tümünün onaylandığı veya erişilebilirliğinin garanti edildiği anlamına gelmez."],["Sorumluluk","Bilgiler geneldir ve her bireysel duruma uygun olmayabilir. Kanunen sınırlandırılamayan haklar ve sorumluluklar bu koşullarla ortadan kaldırılmaz veya sınırlandırılmaz."],["Gizlilik ve depolama","Kişisel veriler gizlilik politikası ve yürürlükteki hukuka göre işlenir. Çerezler ve benzer teknolojiler açıklanır; yasal olarak gerektiğinde onay istenir."],["Değişiklikler","Koşullar gerektiğinde güncellenebilir. Geçerli sürüm ve son güncelleme tarihi sitede gösterilir."],["Uygulanacak hukuk","Zorunlu kullanıcı koruma ve yargı yetkisi kuralları saklı kalmak üzere Hollanda hukuku uygulanır."]]};const ui={"ar":["تنظيم استخدام منصة القانون AQ","سياسة الخصوصية","العودة إلى المنصة","اللغة"],"nl":["Voorwaarden voor het gebruik van Al-Qanon AQ","Privacybeleid","Terug naar het platform","Taal"],"en":["Terms governing the use of Al-Qanon AQ","Privacy Policy","Back to the platform","Language"],"tr":["Al-Qanon AQ kullanım koşulları","Gizlilik Politikası","Platforma dön","Dil"]};function render(l){document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";document.getElementById("heading").textContent=titles[l];document.getElementById("subtitle").textContent=ui[l][0];document.getElementById("privacy").textContent=ui[l][1];document.getElementById("home").textContent=ui[l][2];document.getElementById("langLabel").textContent=ui[l][3];document.getElementById("content").innerHTML=data[l].map((a,i)=>"<section><h2>"+(i+1)+". "+a[0]+"</h2><p>"+a[1]+"</p></section>").join("");document.getElementById("lang").value=l}document.getElementById("lang").addEventListener("change",e=>render(e.target.value));render("ar");</script></body></html>
